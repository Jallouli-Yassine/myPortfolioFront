<div class="main-wrapper">
  <section class="cta-section theme-bg-light py-5">
    <div class="container text-center single-col-max-width">
      <h2 class="heading mb-3">{{ t.translate('resume.title') }}</h2>
      <a class="btn btn-primary" [href]="cvPath" download="Jallouli_Yassine_CV.pdf"><i class="fas fa-file-pdf me-2"></i>{{ t.translate('resume.download') }}</a>
    </div><!--//container-->
  </section>
  <div class="container resume-container px-3 px-lg-5">

    <article class="resume-wrapper mx-auto p-5 mb-5 my-5 shadow-lg">
      <div class="resume-container">
        <iframe 
          [src]="safeCvUrl" 
          width="100%" 
          height="1000px" 
          style="border: none; border-radius: 8px;">
        </iframe>
      </div>
    </article>
  </div><!--//container-->
</div><!--//main-wrapper-->
