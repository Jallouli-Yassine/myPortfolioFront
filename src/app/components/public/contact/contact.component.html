<div class="main-wrapper">
  <section class="cta-section theme-bg-light py-5">
    <div class="container text-center single-col-max-width">
      <h2 class="heading">Contact</h2>
      <div class="intro">
        <p>Interested in working together? Send me an email at <a class="text-link" href="mailto:yassine.jallouli@esprit.tn">yassine.jallouli@esprit.tn</a> or connect with me on LinkedIn.</p>
        <p>Find me online through the links below.</p>
        <ul class="list-inline mb-0">
          <li class="list-inline-item mb-3"><a class="linkedin" href="https://www.linkedin.com/in/jallouliyassine/" target="_blank" rel="noopener"><i class="fab fa-linkedin-in fa-fw fa-lg"></i></a></li>
          <li class="list-inline-item mb-3"><a class="github" href="https://github.com/Jallouli-Yassine" target="_blank" rel="noopener"><i class="fab fa-github-alt fa-fw fa-lg"></i></a></li>
          <li class="list-inline-item mb-3"><a class="email" href="mailto:yassine.jallouli@esprit.tn"><i class="fas fa-envelope fa-fw fa-lg"></i></a></li>
        </ul><!--//social-list-->
      </div><!--//intro-->
    </div><!--//container-->
  </section><!--//cta-section-->

  <section class="contact-section px-3 py-5 p-md-5">
    <div class="container">
      <form id="contact-form" class="contact-form col-lg-8 mx-lg-auto" method="post" action="mailto:yassine.jallouli@esprit.tn" enctype="text/plain">
        <h3 class="text-center mb-3">Get In Touch</h3>
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="sr-only" for="cname">Name</label>
            <input type="text" class="form-control" id="cname" name="name" placeholder="Name" minlength="2" required="" aria-required="true">
          </div>
          <div class="col-12 col-md-6">
            <label class="sr-only" for="cemail">Email</label>
            <input type="email" class="form-control" id="cemail" name="email" placeholder="Email" required="" aria-required="true">
          </div>
          <div class="col-12">
            <input type="text" class="form-control" id="csubject" name="subject" placeholder="Subject" required="" aria-required="true">
          </div>
          <div class="col-12">
            <label class="sr-only" for="cmessage">Your message</label>
            <textarea class="form-control" id="cmessage" name="message" placeholder="Enter your message" rows="10" required="" aria-required="true"></textarea>
          </div>
          <div class="form-group col-12">
            <button type="submit" class="btn btn-block btn-primary py-2">Send Now</button>
          </div>
        </div><!--//row-->
      </form>
    </div><!--//container-->
  </section><!--//contact-section-->

</div><!--//main-wrapper-->
